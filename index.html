<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Список покупок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Список покупок">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0C0C0C">
<link rel="stylesheet" href="style.css">
<script>
  // Тема выставляется до отрисовки страницы, чтобы не мигал неверный фон при загрузке
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('shopping-list-theme'); } catch (e) {}
    if (theme !== 'light' && theme !== 'dark') {
      theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>
<div class="wrap">
    <div class="receipt">
    <header>
      <div class="head-text">
        <span class="stamp" id="viewStamp">СПИСОК</span>
        <h1 id="viewTitle">Что купить</h1>
        <p class="date" id="dateLine"></p>
      </div>
      <div class="head-actions">
        <button class="order-toggle" id="orderToggle">Разделы списка</button>
        <button class="theme-toggle" id="themeToggle" type="button"></button>
      </div>
    </header>

    <section class="order-panel view" id="orderPanel" hidden>
      <div class="order-panel-inner">
        <p class="order-hint">Перетащите разделы за значок ⠿, чтобы расставить их в удобном порядке. Чтобы убрать раздел, смахните его влево.</p>
        <div id="orderList"></div>
        <div class="preset-row">
          <input id="newCategoryName" placeholder="Название нового раздела" autocomplete="off" />
          <button class="preset-btn" id="addCategoryBtn">Добавить</button>
        </div>
        <div class="preset-section">
          <p class="preset-label">Сохранённые порядки</p>
          <div class="preset-row">
            <select id="presetSelect"><option value="">— выбрать —</option></select>
            <button class="preset-btn" id="applyPresetBtn">Выбрать</button>
          </div>
          <div class="preset-row">
            <input id="presetName" placeholder="Название нового порядка" autocomplete="off" />
            <button class="preset-btn" id="savePresetBtn">Сохранить</button>
          </div>
          <button class="preset-delete" id="deletePresetBtn" style="display:none">Удалить сохранённый порядок «<span id="deletePresetName"></span>»</button>
        </div>
      </div>
    </section>

    <div class="view" id="viewList">
      <div class="add-row">
        <div class="fields">
          <input id="itemName" placeholder="Например, молоко" autocomplete="off" />
          <input id="itemQty" placeholder="1 шт" autocomplete="off" />
        </div>
        <select id="itemCat"></select>
        <button class="add-btn" id="addBtn">Добавить в список</button>
      </div>
  
      <div class="list" id="listArea"></div>
  
      <footer>
        <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
        <div class="totals"><span>Всего позиций</span><span class="num" id="totalCount">0</span></div>
        <div class="totals"><span>Куплено</span><span class="num" id="boughtCount">0 из 0</span></div>
        <button class="clear-btn" id="clearBtn">Убрать купленное</button>
        <div class="backup-row">
          <button class="backup-link" id="exportBtn">Скачать резервную копию</button>
          <button class="backup-link" id="importBtn">Восстановить из файла</button>
          <input type="file" id="importFile" accept="application/json" style="display:none" />
        </div>
      </footer>
    </div>
  </div>
</div>

<!-- Порядок важен: каждый следующий файл использует то, что объявлено в предыдущих -->
<script src="model.js"></script>
<script src="categories.js"></script>
<script src="index.js"></script>
</body>
</html>
